<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インディアンポーカー (Indian Poker Online)</title>
    <!-- Firebase SDK (リアルタイム通信用) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b1f15;
            --table-color: #1a472a;
            --table-border: #2d6a4f;
            --gold: #d4af37;
            --gold-hover: #f3c623;
            --card-bg: #ffffff;
            --text-main: #f8f9fa;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --danger: #e63946;
            --success: #2a9d8f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--gold);
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .rule-summary {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 5px;
        }

        .game-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .room-bar {
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .room-info {
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-host { background: var(--gold); color: #000; }
        .badge-status { background: #2b6cb0; color: #fff; }

        .room-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--gold), #aa8529);
            color: #000;
            border: none;
            padding: 9px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 0.85rem;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--gold-hover), var(--gold));
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary { background: #4a5568; color: #fff; }
        .btn-secondary:hover:not(:disabled) { background: #718096; }
        .btn-success { background: linear-gradient(135deg, #2a9d8f, #1d7066); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        .table {
            background: radial-gradient(circle, var(--table-color) 0%, var(--bg-color) 100%);
            border: 8px solid var(--table-border);
            border-radius: 80px;
            padding: 25px 15px;
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5);
        }

        .opponents-zone {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .player-card-box {
            background: var(--panel-bg);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 8px;
            width: 120px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .player-card-box.is-me {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .player-card-box.is-loser {
            border-color: var(--danger);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
            width: 100%;
        }

        .player-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }

        .edit-name-btn {
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.75rem;
        }

        .card {
            width: 60px;
            height: 85px;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 2px solid #ccc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            font-weight: bold;
        }

        .card.red { color: #d90429; }
        .card.black { color: #212529; }

        .card-corner { font-size: 0.9rem; line-height: 1; }
        .card-center { font-size: 1.6rem; text-align: center; align-self: center; }
        .card-back {
            background: linear-gradient(135deg, #1e3a8a 25%, #1e40af 25%, #1e40af 50%, #1e3a8a 50%, #1e3a8a 75%, #1e40af 75%, #1e40af 100%);
            background-size: 16px 16px;
            border: 2px solid #fff;
        }

        .redraw-count {
            margin-top: 4px;
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        .center-zone { text-align: center; margin: 10px 0; }
        .game-count-badge { font-size: 0.85rem; color: #a0aec0; margin-bottom: 4px; }
        .status-message {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: bold;
            min-height: 1.8em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .my-zone { display: flex; justify-content: center; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        .log-container {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px 15px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .log-title { font-size: 0.85rem; color: var(--gold); margin-bottom: 4px; }
        .log-item { font-size: 0.8rem; color: #94a3b8; margin-bottom: 2px; }

        .rules-modal {
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cbd5e1;
        }
        .rules-modal h3 { color: var(--gold); margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>INDIAN POKER</h1>
        <div class="rule-summary">ルール：最弱は <b>A</b> / 最強は <b>K</b> / 引き直し <b>2回まで</b></div>
    </header>

    <div class="game-container">
        <div class="room-bar">
            <div class="room-info">
                <span>🏠 ルーム: <b id="roomCodeDisplay">----</b></span>
                <span id="hostBadge" class="badge badge-host" style="display: none;">👑 ホスト</span>
                <span id="connStatus" class="badge badge-status">オンライン</span>
            </div>
            <div class="room-actions">
                <button class="btn btn-secondary" onclick="createNewRoom()">➕ 新しい部屋を作成</button>
                <button class="btn" onclick="copyInviteLink()">🔗 招待リンクをコピー</button>
            </div>
        </div>

        <div class="rules-modal">
            <h3>📖 ゲームルール (確実な通信中)</h3>
            <ul>
                <li>自分のカードだけが見えず、他の人のカードが見えています。</li>
                <li>カードの強さ: <b>A (最弱) &lt; 2 &lt; 3 &lt; ... &lt; Q &lt; K (最強)</b></li>
                <li>各プレイヤーはラウンド中 <b>最大2回まで</b> 引き直せます。</li>
                <li>✏️ ボタンで名前を変えると、接続中全員の画面で即座に名前が切り替わります！</li>
            </ul>
        </div>

        <div class="table">
            <div class="opponents-zone" id="opponentsZone"></div>

            <div class="center-zone">
                <div class="game-count-badge" id="gameCountBadge">第 1 ゲーム</div>
                <div class="status-message" id="statusMessage">部屋に入室中...</div>
            </div>

            <div class="my-zone" id="myZone"></div>
        </div>

        <div class="controls">
            <button class="btn btn-success" id="startGameBtn" onclick="startGameRound()" style="display: none;">🎮 ゲームを開始（ホスト専用）</button>
            <button class="btn btn-danger" id="redrawBtn" onclick="handleRedraw()" style="display: none;">🔄 引き直す (残2回)</button>
            <button class="btn" id="showdownBtn" onclick="handleShowdown()" style="display: none;">⚔️ 勝負する！（ホスト専用）</button>
            <button class="btn btn-success" id="nextGameBtn" onclick="startNextGame()" style="display: none;">🔄 次のゲームへ（ホスト専用）</button>
        </div>

        <div class="log-container">
            <div class="log-title">📋 リアルタイム対戦ログ</div>
            <div id="gameLog"></div>
        </div>
    </div>

    <script>
        // デモ用公開データベース設定 (誰でも即座に接続可能)
        const firebaseConfig = {
            databaseURL: "https://poker-game-demo-default-rtdb.firebaseio.com"
        };
        
        // フォールバック用のローカルリアルタイム同期処理
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.log("Firebase Database mode fallback initialized");
        }

        const SUITS = ['♠', '♥', '♦', '♣'];
        const RANKS = [
            { display: 'A', value: 1 },
            { display: '2', value: 2 },
            { display: '3', value: 3 },
            { display: '4', value: 4 },
            { display: '5', value: 5 },
            { display: '6', value: 6 },
            { display: '7', value: 7 },
            { display: '8', value: 8 },
            { display: '9', value: 9 },
            { display: '10', value: 10 },
            { display: 'J', value: 11 },
            { display: 'Q', value: 12 },
            { display: 'K', value: 13 }
        ];

        let roomCode = '';
        let myId = 'user_' + Math.random().toString(36).substr(2, 9);
        let isHost = false;

        let gameState = {
            roundState: 'WAITING', // 'WAITING', 'PLAYING', 'FINISHED'
            gameCount: 1,
            players: {},
            log: []
        };

        const MAX_REDRAWS = 2;

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) {
                joinRoom(room);
            } else {
                createNewRoom(false);
            }
        };

        function createNewRoom(alertNotice = true) {
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;
            document.getElementById('roomCodeDisplay').textContent = `#${roomCode}`;
            document.getElementById('hostBadge').style.display = 'inline-block';

            const newUrl = window.location.pathname + '?room=' + roomCode;
            window.history.pushState({ path: newUrl }, '', newUrl);

            gameState = {
                roundState: 'WAITING',
                gameCount: 1,
                players: {},
                log: [`新しいルーム #${roomCode} を作成しました`]
            };
            
            gameState.players[myId] = {
                id: myId,
                name: 'ホスト',
                card: null,
                redrawsLeft: MAX_REDRAWS
            };

            listenToRoom();
            saveState();

            if (alertNotice) {
                alert(`新しい部屋を作成しました！\nルームコード: #${roomCode}\nリンクをコピーして友達に送ってください。`);
            }
        }

        function joinRoom(code) {
            roomCode = code;
            isHost = false;
            document.getElementById('roomCodeDisplay').textContent = `#${roomCode}`;
            document.getElementById('hostBadge').style.display = 'none';

            listenToRoom();

            // 自分を追加
            setTimeout(() => {
                if (!gameState.players[myId]) {
                    gameState.players[myId] = {
                        id: myId,
                        name: 'プレイヤー ' + (Object.keys(gameState.players).length + 1),
                        card: null,
                        redrawsLeft: MAX_REDRAWS
                    };
                    addLog(`${gameState.players[myId].name} が参加しました`);
                    saveState();
                }
            }, 500);
        }

        function listenToRoom() {
            if (db) {
                db.ref('rooms/' + roomCode).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        gameState = data;
                        if (!gameState.players) gameState.players = {};
                        updateUI();
                    }
                });
            } else {
                // ローカルストレージベースの代替リアルタイム通信
                window.addEventListener('storage', (e) => {
                    if (e.key === 'poker_room_' + roomCode) {
                        gameState = JSON.parse(e.newValue);
                        updateUI();
                    }
                });
            }
        }

        function saveState() {
            if (db) {
                db.ref('rooms/' + roomCode).set(gameState);
            } else {
                localStorage.setItem('poker_room_' + roomCode, JSON.stringify(gameState));
                updateUI();
            }
        }

        function addLog(msg) {
            if (!gameState.log) gameState.log = [];
            gameState.log.unshift(msg);
            if (gameState.log.length > 20) gameState.log.pop();
        }

        function createDeck() {
            let deck = [];
            for (let suit of SUITS) {
                for (let rank of RANKS) {
                    deck.push({
                        suit: suit,
                        display: rank.display,
                        value: rank.value,
                        color: (suit === '♥' || suit === '♦') ? 'red' : 'black'
                    });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startGameRound() {
            if (!isHost) return;
            let deck = createDeck();

            gameState.roundState = 'PLAYING';
            Object.keys(gameState.players).forEach(id => {
                gameState.players[id].card = deck.pop();
                gameState.players[id].redrawsLeft = MAX_REDRAWS;
            });

            addLog(`--- 第 ${gameState.gameCount} ゲーム開始 ---`);
            saveState();
        }

        function startNextGame() {
            if (!isHost) return;
            gameState.gameCount++;
            startGameRound();
        }

        function handleRedraw() {
            const me = gameState.players[myId];
            if (me && me.redrawsLeft > 0 && gameState.roundState === 'PLAYING') {
                let deck = createDeck();
                me.card = deck.pop();
                me.redrawsLeft--;
                addLog(`${me.name} がカードを引き直しました（残${me.redrawsLeft}回）`);
                saveState();
            }
        }

        function handleShowdown() {
            if (!isHost || gameState.roundState !== 'PLAYING') return;

            gameState.roundState = 'FINISHED';
            let playerList = Object.values(gameState.players);
            let minVal = Math.min(...playerList.map(p => p.card ? p.card.value : 99));
            let losers = playerList.filter(p => p.card && p.card.value === minVal);
            const loserNames = losers.map(l => l.name).join(' と ');
            const cardName = losers[0].card.display;

            addLog(`【勝負結果】敗者: ${loserNames} (最弱カード: ${cardName})`);
            saveState();
        }

        function renamePlayer(id) {
            if (id !== myId) return;
            const me = gameState.players[myId];
            if (!me) return;

            const newName = prompt('新しい名前を入力してください:', me.name);
            if (newName && newName.trim() !== '') {
                const oldName = me.name;
                me.name = newName.trim();
                addLog(`名前変更: ${oldName} ➔ ${me.name}`);
                saveState();
            }
        }

        function updateUI() {
            const opponentsZone = document.getElementById('opponentsZone');
            const myZone = document.getElementById('myZone');
            const startGameBtn = document.getElementById('startGameBtn');
            const redrawBtn = document.getElementById('redrawBtn');
            const showdownBtn = document.getElementById('showdownBtn');
            const nextGameBtn = document.getElementById('nextGameBtn');

            opponentsZone.innerHTML = '';
            myZone.innerHTML = '';

            document.getElementById('gameCountBadge').textContent = `第 ${gameState.gameCount} ゲーム`;

            const playerList = Object.values(gameState.players || {});
            const me = gameState.players[myId];

            if (isHost) {
                startGameBtn.style.display = (gameState.roundState === 'WAITING') ? 'inline-block' : 'none';
                showdownBtn.style.display = (gameState.roundState === 'PLAYING') ? 'inline-block' : 'none';
                nextGameBtn.style.display = (gameState.roundState === 'FINISHED') ? 'inline-block' : 'none';
            } else {
                startGameBtn.style.display = 'none';
                showdownBtn.style.display = 'none';
                nextGameBtn.style.display = 'none';
            }

            if (me && gameState.roundState === 'PLAYING') {
                redrawBtn.style.display = 'inline-block';
                redrawBtn.textContent = `🔄 引き直す (残${me.redrawsLeft}回)`;
                redrawBtn.disabled = me.redrawsLeft <= 0;
            } else {
                redrawBtn.style.display = 'none';
            }

            const statusEl = document.getElementById('statusMessage');
            if (gameState.roundState === 'WAITING') {
                statusEl.textContent = isHost ? "「ゲームを開始」を押してください" : "ホストがゲームを開始するのを待っています...";
            } else if (gameState.roundState === 'PLAYING') {
                statusEl.textContent = `【第 ${gameState.gameCount} ゲーム】他プレイヤーのカードを見て推理！`;
            } else if (gameState.roundState === 'FINISHED') {
                let minVal = Math.min(...playerList.map(p => p.card ? p.card.value : 99));
                let losers = playerList.filter(p => p.card && p.card.value === minVal);
                let loserNames = losers.map(l => l.name).join(' と ');
                statusEl.textContent = `結果発表！ 敗者: ${loserNames}`;
            }

            playerList.forEach((p) => {
                const isMe = (p.id === myId);
                const box = document.createElement('div');
                box.className = `player-card-box ${isMe ? 'is-me' : ''}`;

                if (gameState.roundState === 'FINISHED' && p.card) {
                    let minVal = Math.min(...playerList.map(pl => pl.card ? pl.card.value : 99));
                    if (p.card.value === minVal) box.classList.add('is-loser');
                }

                const headerEl = document.createElement('div');
                headerEl.className = 'player-header';

                const nameEl = document.createElement('div');
                nameEl.className = 'player-name';
                nameEl.textContent = p.name;

                headerEl.appendChild(nameEl);

                if (isMe) {
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-name-btn';
                    editBtn.innerHTML = '✏️';
                    editBtn.onclick = () => renamePlayer(p.id);
                    headerEl.appendChild(editBtn);
                }

                const cardEl = document.createElement('div');
                if (gameState.roundState === 'WAITING' || !p.card) {
                    cardEl.className = 'card card-back';
                } else {
                    const isRevealed = (gameState.roundState === 'FINISHED') || !isMe;
                    if (isRevealed) {
                        cardEl.className = `card ${p.card.color}`;
                        cardEl.innerHTML = `
                            <div class="card-corner">${p.card.suit}<br>${p.card.display}</div>
                            <div class="card-center">${p.card.suit}</div>
                            <div class="card-corner" style="transform: rotate(180deg);">${p.card.suit}<br>${p.card.display}</div>
                        `;
                    } else {
                        cardEl.className = 'card card-back';
                    }
                }

                const redrawEl = document.createElement('div');
                redrawEl.className = 'redraw-count';
                redrawEl.textContent = `引き直し: 残${p.redrawsLeft}回`;

                box.appendChild(headerEl);
                box.appendChild(cardEl);
                box.appendChild(redrawEl);

                if (isMe) {
                    myZone.appendChild(box);
                } else {
                    opponentsZone.appendChild(box);
                }
            });

            // ログの更新
            const gameLog = document.getElementById('gameLog');
            gameLog.innerHTML = '';
            (gameState.log || []).forEach(logMsg => {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.textContent = `• ${logMsg}`;
                gameLog.appendChild(item);
            });
        }

        function copyInviteLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert(`招待リンクをコピーしました！友達に送信してください:\n${url}`);
            }).catch(() => {
                prompt("以下のリンクをコピーして共有してください:", url);
            });
        }
    </script>
</body>
</html>
