<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インディアンポーカー (Indian Poker)</title>
    <!-- PeerJS（無料のリアルタイムP2P通信ライブラリ） -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1f15;
            --table-color: #1a472a;
            --table-border: #2d6a4f;
            --gold: #d4af37;
            --gold-hover: #f3c623;
            --card-bg: #ffffff;
            --text-main: #f8f9fa;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --danger: #e63946;
            --success: #2a9d8f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--gold);
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .rule-summary {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 5px;
        }

        .game-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .room-bar {
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .room-info {
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-host { background: var(--gold); color: #000; }
        .badge-status { background: #2b6cb0; color: #fff; }

        .room-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--gold), #aa8529);
            color: #000;
            border: none;
            padding: 9px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 0.85rem;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--gold-hover), var(--gold));
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary { background: #4a5568; color: #fff; }
        .btn-secondary:hover:not(:disabled) { background: #718096; }
        .btn-success { background: linear-gradient(135deg, #2a9d8f, #1d7066); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* ポーカーテーブル */
        .table {
            background: radial-gradient(circle, var(--table-color) 0%, var(--bg-color) 100%);
            border: 8px solid var(--table-border);
            border-radius: 80px;
            padding: 25px 15px;
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5);
        }

        .opponents-zone {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .player-card-box {
            background: var(--panel-bg);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 8px;
            width: 120px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .player-card-box.is-me {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .player-card-box.is-loser {
            border-color: var(--danger);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
            width: 100%;
        }

        .player-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }

        .edit-name-btn {
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.75rem;
        }

        .card {
            width: 60px;
            height: 85px;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 2px solid #ccc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            font-weight: bold;
        }

        .card.red { color: #d90429; }
        .card.black { color: #212529; }

        .card-corner { font-size: 0.9rem; line-height: 1; }
        .card-center { font-size: 1.6rem; text-align: center; align-self: center; }
        .card-back {
            background: linear-gradient(135deg, #1e3a8a 25%, #1e40af 25%, #1e40af 50%, #1e3a8a 50%, #1e3a8a 75%, #1e40af 75%, #1e40af 100%);
            background-size: 16px 16px;
            border: 2px solid #fff;
        }

        .redraw-count {
            margin-top: 4px;
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        .center-zone { text-align: center; margin: 10px 0; }
        .game-count-badge { font-size: 0.85rem; color: #a0aec0; margin-bottom: 4px; }
        .status-message {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: bold;
            min-height: 1.8em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .my-zone { display: flex; justify-content: center; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        .log-container {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px 15px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .log-title { font-size: 0.85rem; color: var(--gold); margin-bottom: 4px; }
        .log-item { font-size: 0.8rem; color: #94a3b8; margin-bottom: 2px; }

        .rules-modal {
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cbd5e1;
        }
        .rules-modal h3 { color: var(--gold); margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>INDIAN POKER</h1>
        <div class="rule-summary">ルール：最弱は <b>A</b> / 最強は <b>K</b> / 引き直し <b>2回まで</b></div>
    </header>

    <div class="game-container">
        <!-- ルーム・通信接続バー -->
        <div class="room-bar">
            <div class="room-info">
                <span>🏠 ルーム: <b id="roomCodeDisplay">----</b></span>
                <span id="hostBadge" class="badge badge-host" style="display: none;">👑 ホスト</span>
                <span id="connStatus" class="badge badge-status">接続準備中...</span>
            </div>
            <div class="room-actions">
                <button class="btn btn-secondary" onclick="createNewRoom()">➕ 新しい部屋を作成</button>
                <button class="btn" onclick="copyInviteLink()">🔗 招待リンクをコピー</button>
            </div>
        </div>

        <!-- ルール確認 -->
        <div class="rules-modal">
            <h3>📖 ゲームルール (リアルタイム通信中)</h3>
            <ul>
                <li>自分のカードだけが見えず、他の人のカードが見えています。</li>
                <li>カードの強さ: <b>A (最弱) &lt; 2 &lt; 3 &lt; ... &lt; Q &lt; K (最強)</b></li>
                <li>各プレイヤーはラウンド中 <b>最大2回まで</b> 引き直せます。✏️を押せば全員の画面で名前が変わります！</li>
            </ul>
        </div>

        <!-- ポーカーテーブル -->
        <div class="table">
            <div class="opponents-zone" id="opponentsZone"></div>

            <div class="center-zone">
                <div class="game-count-badge" id="gameCountBadge">第 1 ゲーム</div>
                <div class="status-message" id="statusMessage">接続中...</div>
            </div>

            <div class="my-zone" id="myZone"></div>
        </div>

        <!-- アクションボタン -->
        <div class="controls">
            <button class="btn btn-success" id="startGameBtn" onclick="startGameRound()" style="display: none;">🎮 ゲームを開始（ホスト専用）</button>
            <button class="btn btn-danger" id="redrawBtn" onclick="handleRedraw()" style="display: none;">🔄 引き直す (残2回)</button>
            <button class="btn" id="showdownBtn" onclick="handleShowdown()" style="display: none;">⚔️ 勝負する！</button>
            <button class="btn btn-success" id="nextGameBtn" onclick="startNextGame()" style="display: none;">🔄 次のゲームへ（ホスト専用）</button>
        </div>

        <!-- 履歴ログ -->
        <div class="log-container">
            <div class="log-title">📋 リアルタイム対戦ログ</div>
            <div id="gameLog"></div>
        </div>
    </div>

    <script>
        const SUITS = ['♠', '♥', '♦', '♣'];
        const RANKS = [
            { display: 'A', value: 1 },
            { display: '2', value: 2 },
            { display: '3', value: 3 },
            { display: '4', value: 4 },
            { display: '5', value: 5 },
            { display: '6', value: 6 },
            { display: '7', value: 7 },
            { display: '8', value: 8 },
            { display: '9', value: 9 },
            { display: '10', value: 10 },
            { display: 'J', value: 11 },
            { display: 'Q', value: 12 },
            { display: 'K', value: 13 }
        ];

        let peer = null;
        let connections = []; // ホストが保持する全ゲストの接続
        let hostConn = null;  // ゲストが保持するホストとの接続
        let myId = '';
        let isHost = false;
        let roomCode = '';

        let deck = [];
        let players = []; // { id, name, card, redrawsLeft }
        let roundState = 'WAITING'; // 'WAITING', 'PLAYING', 'FINISHED'
        let gameCount = 1;
        const MAX_REDRAWS = 2;

        // PeerJSのプレフィックス（他アプリとの衝突防止）
        const PEER_PREFIX = 'indian-poker-room-v1-';

        // 初期ロード処理
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');

            if (room) {
                // 招待URLから参加（ゲスト）
                joinRoom(room);
            } else {
                // 新規部屋作成（ホスト）
                createNewRoom(false);
            }
        };

        // 新規部屋作成 (ホスト)
        function createNewRoom(alertNotice = true) {
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;
            myId = PEER_PREFIX + roomCode;

            document.getElementById('roomCodeDisplay').textContent = `#${roomCode}`;
            document.getElementById('hostBadge').style.display = 'inline-block';
            document.getElementById('connStatus').textContent = 'ホストとして待機中';

            const newUrl = window.location.pathname + '?room=' + roomCode;
            window.history.pushState({ path: newUrl }, '', newUrl);

            // 自分のプレイヤーを追加
            players = [{ id: myId, name: 'ホスト', card: null, redrawsLeft: MAX_REDRAWS }];

            initPeerHost();

            if (alertNotice) {
                alert(`新しい部屋を作成しました！\nルームコード: #${roomCode}\n「招待リンクをコピー」を押して友達を送ってください。`);
            }
            updateUI();
        }

        // 部屋に参加 (ゲスト)
        function joinRoom(code) {
            roomCode = code;
            isHost = false;
            document.getElementById('roomCodeDisplay').textContent = `#${roomCode}`;
            document.getElementById('hostBadge').style.display = 'none';
            document.getElementById('connStatus').textContent = 'ホストへ接続中...';

            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                const hostPeerId = PEER_PREFIX + roomCode;
                hostConn = peer.connect(hostPeerId);

                hostConn.on('open', () => {
                    document.getElementById('connStatus').textContent = 'オンライン';
                    logMessage('ホストに接続しました！');
                    // ホストに参加通知
                    hostConn.send({ type: 'JOIN', name: 'プレイヤー' });
                });

                hostConn.on('data', (data) => handleIncomingData(data));

                hostConn.on('close', () => {
                    document.getElementById('connStatus').textContent = '切断されました';
                    alert('ホストとの接続が切断されました。');
                });
            });
        }

        // ホスト用Peer初期化
        function initPeerHost() {
            if (peer) peer.destroy();
            peer = new Peer(myId);

            peer.on('open', () => {
                document.getElementById('connStatus').textContent = 'オンライン (待機中)';
                logMessage(`ルーム #${roomCode} を作成しました。ゲストの参加を待っています。`);
            });

            peer.on('connection', (conn) => {
                connections.push(conn);

                conn.on('data', (data) => {
                    handleHostReceivedData(conn, data);
                });

                conn.on('close', () => {
                    players = players.filter(p => p.id !== conn.peer);
                    broadcastState();
                    logMessage(`プレイヤーが退出しました。`);
                });
            });
        }

        // ホストが受信したデータの処理
        function handleHostReceivedData(conn, data) {
            if (data.type === 'JOIN') {
                const newPlayer = {
                    id: conn.peer,
                    name: `${data.name} ${players.length}`,
                    card: null,
                    redrawsLeft: MAX_REDRAWS
                };
                players.push(newPlayer);
                logMessage(`${newPlayer.name} が部屋に参加しました！`);
                broadcastState();
            } else if (data.type === 'RENAME') {
                const player = players.find(p => p.id === conn.peer);
                if (player) {
                    const oldName = player.name;
                    player.name = data.newName;
                    logMessage(`名前変更: ${oldName} ➔ ${player.name}`);
                    broadcastState();
                }
            } else if (data.type === 'REDRAW') {
                const player = players.find(p => p.id === conn.peer);
                if (player && player.redrawsLeft > 0 && roundState === 'PLAYING') {
                    player.card = drawCard();
                    player.redrawsLeft--;
                    logMessage(`${player.name} がカードを引き直しました！（残${player.redrawsLeft}回）`);
                    broadcastState();
                }
            }
        }

        // ゲストが受信した状態同期の処理
        function handleIncomingData(data) {
            if (data.type === 'SYNC_STATE') {
                players = data.players;
                roundState = data.roundState;
                gameCount = data.gameCount;
                if (data.log) logMessage(data.log);
                updateUI();
            }
        }

        // ホストが全員へ最新状態を配信 (ブロードキャスト)
        function broadcastState(logMsg = null) {
            const payload = {
                type: 'SYNC_STATE',
                players: players,
                roundState: roundState,
                gameCount: gameCount,
                log: logMsg
            };
            connections.forEach(c => c.send(payload));
            updateUI();
        }

        // 名前変更
        function renamePlayer(id) {
            if (id !== myId) return; // 自分の名前のみ変更可能

            const me = players.find(p => p.id === myId);
            if (!me) return;

            const newName = prompt('新しい名前を入力してください:', me.name);
            if (newName && newName.trim() !== '') {
                me.name = newName.trim();
                if (isHost) {
                    broadcastState(`${me.name} が名前を変更しました。`);
                } else if (hostConn) {
                    hostConn.send({ type: 'RENAME', newName: me.name });
                }
                updateUI();
            }
        }

        // カード・ゲーム処理
        function createDeck() {
            deck = [];
            for (let suit of SUITS) {
                for (let rank of RANKS) {
                    deck.push({
                        suit: suit,
                        display: rank.display,
                        value: rank.value,
                        color: (suit === '♥' || suit === '♦') ? 'red' : 'black'
                    });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawCard() {
            if (deck.length === 0) createDeck();
            return deck.pop();
        }

        // ホスト専用: ゲーム開始
        function startGameRound() {
            if (!isHost) return;
            createDeck();
            roundState = 'PLAYING';

            players.forEach(p => {
                p.card = drawCard();
                p.redrawsLeft = MAX_REDRAWS;
            });

            broadcastState(`--- 第 ${gameCount} ゲームが開始されました ---`);
        }

        // ホスト専用: 次のゲームへ
        function startNextGame() {
            gameCount++;
            startGameRound();
        }

        // 引き直し
        function handleRedraw() {
            const me = players.find(p => p.id === myId);
            if (me && me.redrawsLeft > 0 && roundState === 'PLAYING') {
                if (isHost) {
                    me.card = drawCard();
                    me.redrawsLeft--;
                    broadcastState(`${me.name} がカードを引き直しました！（残${me.redrawsLeft}回）`);
                } else if (hostConn) {
                    hostConn.send({ type: 'REDRAW' });
                }
            }
        }

        // ホスト専用: 勝負
        function handleShowdown() {
            if (!isHost || roundState !== 'PLAYING') return;

            roundState = 'FINISHED';

            let minVal = Math.min(...players.map(p => p.card.value));
            let losers = players.filter(p => p.card.value === minVal);
            const loserNames = losers.map(l => l.name).join(' と ');
            const cardName = losers[0].card.display;

            const resultLog = `勝負結果: 敗者 ${loserNames} (最弱カード: ${cardName})`;
            broadcastState(resultLog);
        }

        // UI描画
        function updateUI() {
            const opponentsZone = document.getElementById('opponentsZone');
            const myZone = document.getElementById('myZone');
            const startGameBtn = document.getElementById('startGameBtn');
            const redrawBtn = document.getElementById('redrawBtn');
            const showdownBtn = document.getElementById('showdownBtn');
            const nextGameBtn = document.getElementById('nextGameBtn');

            opponentsZone.innerHTML = '';
            myZone.innerHTML = '';

            document.getElementById('gameCountBadge').textContent = `第 ${gameCount} ゲーム`;

            const me = players.find(p => p.id === myId);

            // ボタン表示制御
            if (isHost) {
                startGameBtn.style.display = (roundState === 'WAITING') ? 'inline-block' : 'none';
                showdownBtn.style.display = (roundState === 'PLAYING') ? 'inline-block' : 'none';
                nextGameBtn.style.display = (roundState === 'FINISHED') ? 'inline-block' : 'none';
            } else {
                startGameBtn.style.display = 'none';
                showdownBtn.style.display = 'none';
                nextGameBtn.style.display = 'none';
            }

            if (me && roundState === 'PLAYING') {
                redrawBtn.style.display = 'inline-block';
                redrawBtn.textContent = `🔄 引き直す (残${me.redrawsLeft}回)`;
                redrawBtn.disabled = me.redrawsLeft <= 0;
            } else {
                redrawBtn.style.display = 'none';
            }

            // ステータスメッセージ
            const statusEl = document.getElementById('statusMessage');
            if (roundState === 'WAITING') {
                statusEl.textContent = isHost ? "「ゲームを開始」を押してください" : "ホストがゲームを開始するのを待っています...";
            } else if (roundState === 'PLAYING') {
                statusEl.textContent = `【第 ${gameCount} ゲーム】他のプレイヤーのカードを見て推理しましょう！`;
            } else if (roundState === 'FINISHED') {
                let minVal = Math.min(...players.map(p => p.card ? p.card.value : 99));
                let losers = players.filter(p => p.card && p.card.value === minVal);
                let loserNames = losers.map(l => l.name).join(' と ');
                statusEl.textContent = `ラウンド終了！ 敗者: ${loserNames}`;
            }

            // プレイヤーカード描画
            players.forEach((p) => {
                const isMe = (p.id === myId);
                const box = document.createElement('div');
                box.className = `player-card-box ${isMe ? 'is-me' : ''}`;

                if (roundState === 'FINISHED') {
                    let minVal = Math.min(...players.map(pl => pl.card.value));
                    if (p.card && p.card.value === minVal) box.classList.add('is-loser');
                }

                const headerEl = document.createElement('div');
                headerEl.className = 'player-header';

                const nameEl = document.createElement('div');
                nameEl.className = 'player-name';
                nameEl.textContent = p.name;
                nameEl.title = p.name;

                headerEl.appendChild(nameEl);

                if (isMe) {
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-name-btn';
                    editBtn.innerHTML = '✏️';
                    editBtn.onclick = () => renamePlayer(p.id);
                    headerEl.appendChild(editBtn);
                }

                const cardEl = document.createElement('div');
                if (roundState === 'WAITING' || !p.card) {
                    cardEl.className = 'card card-back';
                } else {
                    // 自分のカードは裏面、他人のカードまたは終了時は表面
                    const isRevealed = (roundState === 'FINISHED') || !isMe;
                    if (isRevealed) {
                        cardEl.className = `card ${p.card.color}`;
                        cardEl.innerHTML = `
                            <div class="card-corner">${p.card.suit}<br>${p.card.display}</div>
                            <div class="card-center">${p.card.suit}</div>
                            <div class="card-corner" style="transform: rotate(180deg);">${p.card.suit}<br>${p.card.display}</div>
                        `;
                    } else {
                        cardEl.className = 'card card-back';
                    }
                }

                const redrawEl = document.createElement('div');
                redrawEl.className = 'redraw-count';
                redrawEl.textContent = `引き直し: 残${p.redrawsLeft}回`;

                box.appendChild(headerEl);
                box.appendChild(cardEl);
                box.appendChild(redrawEl);

                if (isMe) {
                    myZone.appendChild(box);
                } else {
                    opponentsZone.appendChild(box);
                }
            });
        }

        function copyInviteLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert(`招待リンクをコピーしました！友達に送信してください:\n${url}`);
            }).catch(() => {
                prompt("以下のリンクをコピーして共有してください:", url);
            });
        }

        function logMessage(msg) {
            if (!msg) return;
            const gameLog = document.getElementById('gameLog');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.textContent = `• ${msg}`;
            gameLog.prepend(item);
        }
    </script>
</body>
</html>
